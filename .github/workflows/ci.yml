name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go vet ./...
      - run: go test ./...
      - name: race
        if: matrix.os != 'windows-latest'
        run: go test -race ./internal/...

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: fuzz each target briefly (regression corpus always runs in `go test`)
        run: |
          for f in FuzzDecodeRLEHybrid32 FuzzDecodeDefLevels FuzzDecodeDeltaBinaryPacked FuzzOpenCSV FuzzOpenParquet; do
            go test ./internal/source/ -run xxx -fuzz "$f" -fuzztime 20s || exit 1
          done

  crossbuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
          done

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --snapshot --clean
