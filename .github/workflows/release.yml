name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write # ghcr.io image push

jobs:
  # The tag is the trigger, but a tag that fails its own test suite must not
  # become a download. Test first, publish second.
  verify:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go test ./...

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      # linux/arm64 image layers are built on an amd64 runner
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          # A missing or expired TAP_TOKEN skips the Homebrew cask rather than
          # failing a release whose binaries are already built.
          args: >-
            release --clean
            ${{ secrets.TAP_TOKEN == '' && '--skip=homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}

  # Platform wheels wrapping the same binaries, so a Python-first stack can
  # `pip install venn-bin`. Needs PYPI_TOKEN; without it the job is skipped
  # and the GitHub release is unaffected.
  pypi:
    needs: goreleaser
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so there
    # is no API token to store or rotate. Configure the publisher on PyPI as
    # owner KonMam, repository venn, workflow release.yml.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: build --clean --snapshot
      - name: build wheels
        run: |
          python python/build_wheels.py --version "${GITHUB_REF_NAME#v}" --dist dist
          pip install --quiet twine
          twine check python/dist/*.whl
      - name: verify the wheel installs and runs
        run: |
          pip install python/dist/*manylinux2014_x86_64.whl
          venn --version
          venn testdata/tables/v1.csv testdata/tables/v2.csv --key id || test $? -eq 1
      # Allowed to fail: until the PyPI publisher is configured this step
      # errors, and a GitHub release that already exists must not be left
      # looking like a failed release over it.
      - name: publish to PyPI
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
